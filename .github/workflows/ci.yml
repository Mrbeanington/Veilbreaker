name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

      # Client-only platform guard (CLAUDE.md hard constraint): fails the build
      # if the shipped bundle references an external origin or calls
      # fetch/XMLHttpRequest/WebSocket outside the explicit P2P allowlist.
      - run: pnpm verify-client-only
