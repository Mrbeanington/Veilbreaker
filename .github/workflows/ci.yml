name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json's "packageManager" field, not an
      # input here — pnpm/action-setup errors if both are set (Phase 01 CI
      # failure, see docs/DECISIONS.md ADR-008).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

      # Client-only platform guard (CLAUDE.md hard constraint): fails the build
      # if the shipped bundle references an external origin or calls
      # fetch/XMLHttpRequest/WebSocket outside the explicit P2P allowlist.
      - run: pnpm verify-client-only

      # Phase 12: the production build must contain no dev-mode code (also self-tests
      # with a VITE_DEV_MODE=1 build so the check cannot pass vacuously).
      - run: pnpm verify-no-dev-mode

      # Phase 15: the app must stay within its download-size budget.
      - run: pnpm verify-bundle-budget

      # ADR-040: the single-file build must be one self-contained page.
      - run: pnpm build:single
      - run: pnpm verify-single-file
