<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CLAUDE.md "Security (client-only)": no inline eval, no remote script
      sources. The game name is set at runtime from GAME_TITLE
      (src/branding.ts) so it is never hard-coded here (see OQ-26 in
      docs/OPEN-QUESTIONS.md for the dev-server HMR caveat).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <!--
      phase-05-local-playable.md "PWA foundation": manifest.webmanifest and
      the icon files are generated at build time from GAME_TITLE
      (vite.config.ts's veilbreakPwaPlugin) — neither exists under `vite dev`,
      only after `vite build`. theme-color mirrors the manifest's own value.
    -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-512.svg" />
    <meta name="theme-color" content="#100d18" />
    <title>Loading…</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
